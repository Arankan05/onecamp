name: onecamp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Firebase dependencies
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_database: ^11.3.0
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.2.2

  # Media, Audio & File dependencies
  image_picker: ^1.2.4
  file_picker: ^10.3.3
  audioplayers: ^6.1.0
  record: ^5.2.0
  permission_handler: ^11.3.1
  flutter_webrtc: ^0.12.5
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  http: ^1.6.0

  cupertino_icons: ^1.0.8
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  record_platform_interface: 1.4.0
  record_linux: 1.3.1
